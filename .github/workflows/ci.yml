name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Enabled once .pre-commit-config.yaml lands (M0 Task 4).
      - name: pre-commit
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            pipx run pre-commit run --all-files
          else
            echo "no pre-commit config yet — skipping"
          fi

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan, tsan, ubsan]
    steps:
      - uses: actions/checkout@v4
      # FFmpeg is the project's ONE system dependency: cmake/ffmpeg.cmake finds
      # libavformat/avcodec/avutil/swresample through pkg-config, because
      # docs/LICENSING.md requires dynamic linking against a shared build we do
      # not ship. Without it every preset dies at CONFIGURE time with
      # "Package 'libswresample' not found", which looks like four separate
      # build failures and is one missing package.
      #
      # The Linux container has installed it since M1 (docker/Dockerfile); this
      # job never did, so the macOS matrix had never passed.
      - name: Install build dependencies
        run: |
          brew install --quiet ninja pkgconf ffmpeg
          # Fail HERE, naming the package, rather than sixty lines into a CMake
          # backtrace that says "Package 'libswresample' not found" four times.
          pkg-config --modversion libavformat libavcodec libavutil libswresample
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/deps.cmake') }}
      - name: Build and test
        run: scripts/ci.sh ${{ matrix.preset }}

  linux-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CI in container (acceptance path)
        run: docker compose -f docker/compose.yml run --rm ci
