# pre-commit run -a  runs everything below.
# clang-tidy is NOT here by default — it needs compile_commands.json and is too
# slow for every commit. Run it via `scripts/tidy.sh` (CI runs it too).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The TUI snapshots are golden terminal frames: every line is padded to the
      # full width, so a trailing space is content -- it is the blank right
      # margin -- and a missing final newline is what ftxui::Screen::ToString()
      # actually produces. These three hooks silently rewrote all nine of them
      # and broke the tests, which is how the exclusion got here.
      - id: trailing-whitespace
        exclude: ^tests/tui/snapshots/
      - id: end-of-file-fixer
        exclude: ^tests/tui/snapshots/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Audio fixtures are fetched, never committed (docs/TESTING.md).
        args: [--maxkb=256]
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/tui/snapshots/

  # Pinned to 18.x to match clang-format-18 in docker/Dockerfile — a version
  # mismatch here means CI and local disagree about formatting.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (manual — needs a configured build dir)
        entry: scripts/tidy.sh
        language: script
        pass_filenames: false
        stages: [manual]
