# ---------------------------------------------------------------------------
# Locally transcoded — no CC0 source publishes these directly
# ---------------------------------------------------------------------------
# License is inherited from derived_from. Their own hash is informational:
# ffmpeg writes an encoder tag into the WAV header and the bytes differ between
# builds, so these are verified by decoding them back, not by hash equality.

[[fixture]]
path = "kick_44k.wav"
role = "codec:wav"
license = "CC0-1.0"
derived_from = "drum_heavy_kick.flac"
ffmpeg_args = "-c:a pcm_s16le"
# WAV/PCM coverage at the source rate. Lossless from a lossless source, so the
# decoded samples must match the FLAC's exactly — which is what the test asserts.
used_by = ["tests/unit/fixture_decode_test.cpp"]

[[fixture]]
path = "kick_48k.wav"
role = "rate:48000"
license = "CC0-1.0"
derived_from = "drum_heavy_kick.flac"
ffmpeg_args = "-ar 48000 -c:a pcm_s16le"
# The 48 kHz half of the sample-rate coverage docs/TESTING.md requires. Loading
# this on a 48 kHz engine must take the resampler's bit-exact passthrough, while
# the 44.1 kHz files exercise the conversion path.
used_by = ["tests/unit/fixture_decode_test.cpp"]

# ---------------------------------------------------------------------------
# Long-form — assembled here, from CC0 sources listed above
# ---------------------------------------------------------------------------
# Why assembled rather than fetched: a real public-domain recording would be
# better material, and archive.org (where the public-domain jazz lives) was
# unreachable when this landed. It is also a harder provenance question than it
# looks — under the Music Modernization Act only US recordings first published
# in or before 1925 are public domain, those are acoustic-era and were recorded
# with the drums deliberately kept off the horn, and an archive.org uploader's
# "public domain" tag is a claim rather than a rights determination. The hunt is
# deferred to M3, which needs hand-labelled percussive material anyway and is
# the right moment to verify a specific item properly.
#
# The sequence is three different permutations of the nine sources rather than
# one order looped: a 39-second period is plainly visible as a repeat when the
# whole file is on screen, and 116 seconds is not.

[[fixture]]
path = "long_form_drums.flac"
role = "long-form"
license = "CC0-1.0"
derived_from = [
  "loop_industrial.flac", "loop_tabla.flac", "drum_heavy_kick.flac",
  "loop_garzul.flac", "bd_haus.flac", "loop_perc1.flac",
  "ambi_choir.flac", "loop_safari.flac", "loop_compus.flac",
  "loop_perc1.flac", "loop_safari.flac", "bd_haus.flac",
  "loop_compus.flac", "loop_industrial.flac", "ambi_choir.flac",
  "loop_garzul.flac", "drum_heavy_kick.flac", "loop_tabla.flac",
  "loop_garzul.flac", "bd_haus.flac", "loop_compus.flac",
  "loop_perc1.flac", "loop_tabla.flac", "loop_industrial.flac",
  "loop_safari.flac", "drum_heavy_kick.flac", "ambi_choir.flac",
]
derived_duration_seconds = 330
ffmpeg_args = "-c:a flac"
# 5.5 min, 44.1 kHz stereo, ~23 MB. The long-form row docs/TESTING.md requires:
# peak-pyramid construction, scroll and zoom at full frame rate over a file too
# long to rescan per frame.
used_by = ["tests/tui/waveform_perf_test.cpp", "M2 acceptance: a 5-minute file scrolls"]
